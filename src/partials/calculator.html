<section>
  <div class="container">
    <div class="calculator">
      <form class="calculator-input">
        <label class="input-wrapper">
          Bill
          <!-- <br /> -->
          <div class="input-icon-wrapper">
            <svg class="icon-dollar">
              <use href="./img/icons.svg#icon-dollar"></use>
            </svg>
            <input id="bill" type="number" placeholder="0" />
          </div>
        </label>
        <label>
          Select Tip %
          <!-- <br /> -->
          <div class="tip-buttons">
            <button class="tip-btn" data-tip="5">5%</button>
            <button class="tip-btn" data-tip="10">10%</button>
            <button class="tip-btn" data-tip="15">15%</button>
            <button class="tip-btn" data-tip="25">25%</button>
            <button class="tip-btn" data-tip="50">50%</button>
            <input id="custom-tip" type="number" placeholder="Custom" />
          </div>
        </label>
        <label class="input-wrapper"
          >Number of People
          <!-- <br /> -->
          <!-- <svg>
              <use href="./img/icons.svg#icon-people"></use>
          </svg> -->
          <input id="people" type="number" placeholder="0" />
        </label>
      </form>
      <section class="calculator-result">
        <div class="text-wrapper">
          <div class="tip-amount">
            <p>
              Tip Amount <br />
              <span class="text-secondary">/ person</span>
            </p>
            <p id="tip-per-person" class="output">€ 0.00</p>
          </div>
          <div class="total">
            <p>
              Total <br />
              <span class="text-secondary">/ person</span>
            </p>
            <p id="total-per-person" class="output">€ 0.00</p>
          </div>
        </div>
        <button id="reset" class="btn-reset" type="reset">Reset</button>
      </section>
    </div>
  </div>
</section>
